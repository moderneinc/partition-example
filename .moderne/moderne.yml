build:
  partitions:
    - name: root
      steps:
        - type: gradle
          inclusion: |-
            **/*
            !modules/**
        - type: resource
          inclusion: |-
            **/*
            !modules/**
    - name: nest1
      steps:
        - type: gradle
          inclusion: |-
            modules/nestparent/nest1/**
            modules/client/**
        - type: resource
          inclusion: |-
            modules/nestparent/nest1/**
            modules/client/**
    - name: nest3
      steps:
        - type: gradle
          inclusion: |-
            modules/nestparent/nest3/**
            modules/client/**
        - type: resource
          inclusion: |-
            modules/nestparent/nest3/**
            modules/client/**
    - name: service
      steps:
        - type: gradle
          inclusion: |-
            modules/service/**
            modules/client/**
        - type: resource
          inclusion: |-
            modules/service/**
            modules/client/**
